<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4b79a1 0%, #283e51 100%);
      color: #ffffff;
    }
    .welcome-container {
      text-align: center;
      padding: 2rem;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      margin-bottom: 0.5rem;
      font-size: 3rem;
    }
    p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <h1>Welcome!</h1>
    <p>This is a simple welcome page. Start building your site by editing <code>index.html</code>.</p>
  </div>
</body>
</html>
